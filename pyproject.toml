[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentux"
version = "0.1.0"
description = "A terminal-native, provider-agnostic AI coding agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agentux contributors" }]
keywords = ["ai", "agent", "cli", "llm", "openai-compatible", "ollama", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

# Deliberately minimal: an HTTP client and terminal rendering. Pydantic is used
# for the message/tool schemas, which is where validation actually earns its
# keep. No agent framework is required to build an agent.
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/agentux/agentux"
Issues = "https://github.com/agentux/agentux/issues"

[project.scripts]
agentux = "agentux.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
